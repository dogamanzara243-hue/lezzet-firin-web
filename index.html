<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lezzet Fırını - Taze Ürünler</title>
  <!-- Netlify Identity Widget (E-posta ile giriş ve şifre yönlendirmesi için şart) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
    h1 { color: #d35400; text-align: center; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: 30px auto; }
    .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
    .price { font-weight: bold; color: #27ae60; font-size: 1.2em; }
  </style>
</head>
<body>

  <h1>Lezzet Fırını Ürünlerimiz</h1>
  <div class="products" id="product-list">
    <!-- Ürünler dinamik yüklenecek -->
  </div>

  <script>
    // Netlify Identity Giriş Sonrası /admin Yönlendirmesi
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
