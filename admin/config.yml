backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "urunler"
    label: "Ürünler"
    folder: "content/urunler"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Ürün Adı", name: "title", widget: "string" }
      - { label: "Fiyat (TL)", name: "price", widget: "number" }
      - { label: "Açıklama", name: "description", widget: "text" }
      - { label: "Ürün Görseli", name: "image", widget: "image" }
